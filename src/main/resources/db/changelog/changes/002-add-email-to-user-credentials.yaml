databaseChangeLog:
  - changeSet:
      id: 002-add-email-to-user-credentials
      author: kiiitkaaa
      changes:
        - addColumn:
            tableName: user_credentials
            columns:
              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: user_credentials
            columnNames: email
            constraintName: uq_user_credentials_email
      rollback:
        - dropUniqueConstraint:
            tableName: user_credentials
            constraintName: uq_user_credentials_email
        - dropColumn:
            tableName: user_credentials
            columnName: email